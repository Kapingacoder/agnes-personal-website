; Raises upload limits for admin media uploads (lecturer/publication/consultancy
; videos and documents). Only honored by CGI/FastCGI SAPIs such as PHP-FPM;
; silently ignored otherwise (e.g. mod_php or the CLI built-in server), so
; this file is safe to keep even if it has no effect in a given environment.
upload_max_filesize = 150M
post_max_size = 160M
max_execution_time = 300
max_input_time = 300
memory_limit = 256M
